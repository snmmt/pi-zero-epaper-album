# DHCP for PiAlbum AP clients (192.168.4.2 - 192.168.4.20)
# NOTE: no listen-address= line here on purpose.
# dnsmasq starts BEFORE wlan0 has its 192.168.4.1 address unless
# wlan0-ap-ip.service has run first — binding to a not-yet-present
# address makes dnsmasq exit with:
#   "failed to create listening socket for 192.168.4.1:
#    Cannot assign requested address"
# Ordering is handled by systemd (see systemd/wlan0-ap-ip.service).

dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
no-resolv
bind-interfaces
except-interface=lo
log-queries
log-dhcp